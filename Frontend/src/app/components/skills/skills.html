<!-- src/app/components/skills/skills.html -->
<section class="skills-section py-5 font-body">
  <div class="container-fluid max-container px-4">
    
    <!-- Section Header -->
    <div class="text-center mb-5">
      <div class="d-inline-flex align-items-center gap-2 mb-3 px-3 py-1 rounded-pill status-pill-badge">
        <i class="bi bi-shield-check text-cyan fs-6"></i>
        <span class="font-mono text-xs fw-semibold tracking-wide text-secondary">// DOMAIN_CAPABILITIES</span>
      </div>
      <h2 class="display-4 font-display fw-bold text-light mb-3">Technologies & Core Skills</h2>
      <p class="text-secondary max-w-xl mx-auto fs-6">
        Categorized engineering toolset built on practical fullstack software development, AI integrations, and bilingual team leadership.
      </p>
    </div>

    <!-- Skills Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
      <div class="col" *ngFor="let category of skillCategories">
        
        <div class="cyber-card h-100 p-4 d-flex flex-column skill-card-interactive"
             (mouseenter)="setHoveredCategory(category.id)"
             (mouseleave)="setHoveredCategory(null)"
             [class.active-glow]="hoveredCategory === category.id">
          
          <!-- Category Header -->
          <div class="d-flex align-items-center gap-3 mb-3">
            <div class="icon-orb-box">
              <i class="bi {{ category.icon }} text-cyan fs-4"></i>
            </div>
            <div>
              <h3 class="h5 font-display fw-bold text-light mb-0">{{ category.title }}</h3>
              <span class="text-muted font-mono text-xs">// {{ category.id | uppercase }}</span>
            </div>
          </div>

          <p class="text-secondary text-sm mb-4 leading-relaxed flex-grow-1">
            {{ category.description }}
          </p>

          <!-- Skills Pills -->
          <div class="d-flex flex-wrap gap-2 mt-auto pt-3 border-top border-subtle">
            <span *ngFor="let skill of category.skills" class="skill-badge-pill font-mono text-xs">
              {{ skill }}
            </span>
          </div>

        </div>

      </div>
    </div>

  </div>
</section>
