<section class="projects-page-section py-5 font-body">
  <div class="container-fluid max-container px-3 px-md-4">
    
    <!-- Encabezado de Sección con Badges Tecnológicos -->
    <div class="text-center text-md-start mb-5">
      <div class="d-inline-flex align-items-center gap-2 mb-2 px-3 py-1 rounded-pill section-tag-badge">
        <i class="bi bi-terminal-fill text-cyan fs-6"></i>
        <span class="font-mono text-micro fw-bold text-cyan tracking-wider"> Code + love = my projects</span>
      </div>
      <h1 class="display-5 font-display fw-bold text-light mb-2">Projects That Solve Real Problems.</h1>
      <p class="text-secondary fs-6 max-w-2xl mb-0">
        Arquitecturas Full-Stack escalables, interfaces dinámicas de alto rendimiento e integraciones de API REST diseñadas bajo estándares globales.
      </p>
    </div>

    <!-- Toolbar de Búsqueda y Filtros en Card Flotante -->
    <div class="cyber-toolbar-card p-3 p-md-4 rounded-4 mb-5 border border-subtle d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center justify-content-between gap-3">
      
      <!-- Buscador con icono animado -->
      <div class="position-relative search-input-wrapper flex-grow-1 max-w-md">
        <i class="bi bi-search search-icon text-cyan"></i>
        <input 
          type="text" 
          class="form-control cyber-search-input font-mono text-xs ps-5 py-2.5" 
          placeholder="Filter by technology (Angular, Node, Express, API)..." 
          [(ngModel)]="searchQuery">
      </div>

      <!-- Filtros por Categoría -->
      <div class="d-flex align-items-center flex-wrap gap-2">
        <span class="text-muted text-micro font-mono me-1 d-none d-sm-inline">// FILTER_BY:</span>
        <button 
          *ngFor="let cat of categories"
          (click)="filterCategory(cat.id)"
          class="btn btn-filter-pill font-mono text-micro px-3 py-2 rounded-pill"
          [class.active]="selectedCategory === cat.id">
          {{ cat.label }}
        </button>
      </div>

    </div>

    <!-- Grid de Tarjetas Reutilizable -->
    <app-project-cards [projects]="filteredProjects"></app-project-cards>

  </div>
</section>
